<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caneva Admin">
<title>CANEVA Admin Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--k:#050505;--k2:#111;--k3:#1b1b1b;--w:#f7f7f4;--dim:rgba(247,247,244,.55);--b:rgba(247,247,244,.14);--ok:#9de08f;--bad:#ffb4a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--w);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.logo{font-family:"Cormorant Garamond",serif;letter-spacing:.38em;font-size:24px;font-weight:300}
header{position:sticky;top:0;z-index:5;background:rgba(5,5,5,.94);backdrop-filter:blur(10px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--b)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{background:none;border:1px solid var(--b);border-radius:999px;padding:8px 12px;font-size:12px;letter-spacing:.08em}
.search{width:100%;margin-top:10px;background:var(--k2);border:1px solid var(--b);border-radius:12px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;border:1px solid var(--b);border-radius:999px;padding:7px 12px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--w);color:var(--k);border-color:var(--w)}
main{padding:14px 16px 120px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--k2);border:1px solid var(--b);border-radius:14px;overflow:hidden;text-align:left;padding:0;cursor:pointer}
.card .ph{aspect-ratio:3/4;background:var(--k3);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:9px 10px 11px}
.card .n{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.card .p{font-size:13px;color:var(--dim);margin-top:4px}
.badge{display:inline-block;font-size:10px;letter-spacing:.06em;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:1px 5px;margin-left:4px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;background:var(--w);color:var(--k);border:0;border-radius:999px;padding:15px 20px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.muted{color:var(--dim)}.ok{color:var(--ok)}.bad{color:var(--bad)}
/* Login screen */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.login h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:40px;line-height:1;margin:18px 0 10px}
.field{margin-top:14px}
.field label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--k2);border:1px solid var(--b);border-radius:10px;padding:13px 14px;font-size:16px}
.field textarea{min-height:110px;resize:vertical}
.btn{width:100%;border:0;border-radius:12px;padding:16px;font-weight:600;font-size:15px;background:var(--w);color:var(--k);margin-top:16px}
.btn.ghost{background:none;color:var(--w);border:1px solid var(--b)}
.btn.danger{background:none;color:var(--bad);border:1px solid rgba(255,180,168,.4)}
.btn:disabled{opacity:.5}
/* Bottom sheet editor */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:94vh;overflow-y:auto;background:var(--k);border-top:1px solid var(--b);border-radius:20px 20px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{max-width:560px;margin:0 auto}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--b);margin:4px auto 12px}
.photo{position:relative;aspect-ratio:3/4;max-height:52vh;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--k3);display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photobtns{display:flex;gap:10px;margin-top:10px}
.photobtns label{flex:1;text-align:center;border:1px solid var(--b);border-radius:12px;padding:13px;font-weight:500;cursor:pointer}
.photobtns input{display:none}
.newtag{position:absolute;top:10px;left:10px;background:var(--w);color:var(--k);font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--w);color:var(--k);border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--bad)}
.toast button{float:right;background:none;border:0;font-weight:700;text-decoration:underline;color:inherit}
.busy{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--b);border-top-color:var(--w);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Login -->
<section id="loginView" class="login hidden">
  <div class="logo">CΛNEVΛ</div>
  <h1>Admin móvil</h1>
  <p class="muted">Edita productos y fotos desde el celular. Sin Excel.</p>
  <div class="field">
    <label>Token privado</label>
    <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Pega el ADMIN_TOKEN">
  </div>
  <p class="muted" style="font-size:12px;line-height:1.6">Se guarda solo en este celular para no pedirlo cada vez. Úsalo únicamente en tu teléfono personal.</p>
  <button class="btn" id="loginBtn">Entrar</button>
</section>

<!-- Product list -->
<section id="listView" class="hidden">
  <header>
    <div class="hrow">
      <div class="logo">CΛNEVΛ</div>
      <div style="display:flex;gap:8px">
        <button class="iconbtn" id="reloadBtn">Recargar</button>
        <button class="iconbtn" id="logoutBtn">Salir</button>
      </div>
    </div>
    <input id="search" class="search" type="search" placeholder="Buscar producto…">
    <div id="chips" class="chips"></div>
  </header>
  <main>
    <div class="hrow" style="margin:0 0 10px">
      <p id="countLine" class="muted" style="font-size:12px;margin:0"></p>
      <button class="iconbtn hidden" id="renameCatBtn">✎ Renombrar categoría</button>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <button class="fab" id="newBtn">+ Nuevo</button>
</section>

<!-- Editor -->
<div id="sheetBg" class="sheet-bg hidden"></div>
<section id="sheet" class="sheet hidden">
  <div class="grab"></div>
  <div class="photo" id="photoBox"></div>
  <div class="photobtns">
    <label>📷 Tomar foto<input id="camInput" type="file" accept="image/*" capture="environment"></label>
    <label>🖼 Galería<input id="galInput" type="file" accept="image/*"></label>
  </div>
  <div class="field"><label>Nombre</label><input id="fNombre" type="text"></div>
  <div class="row2">
    <div class="field"><label>Precio</label><input id="fPrecio" type="text" inputmode="numeric" placeholder="85000"></div>
    <div class="field"><label>Stock</label><input id="fStock" type="text" inputmode="numeric"></div>
  </div>
  <div class="field"><label>Tallas</label><input id="fTallas" type="text" placeholder="S, M, L  ·  6, 8, 10  ·  Única"></div>
  <div class="field"><label>Categoría</label><select id="fCategoria"></select></div>
  <div class="field hidden" id="newCatField"><label>Nueva categoría</label><input id="fNewCat" type="text"></div>
  <div class="field"><label>Descripción</label><textarea id="fDesc"></textarea></div>
  <button class="btn" id="saveBtn">Guardar y publicar</button>
  <button class="btn ghost" id="cancelBtn">Cancelar</button>
  <button class="btn danger" id="deleteBtn">Eliminar producto</button>
</section>

<div id="toast" class="toast hidden"></div>
<div id="busy" class="busy hidden"><div class="spin"></div><div id="busyMsg">Publicando…</div></div>

<script>
// Mobile admin for Caneva: edits the live catalog (Worker /catalog) and republishes via /admin/catalog.
// Uses the same Worker endpoints and product shape as admin.html, so no Worker changes are needed.
const API_BASE = "https://caneva-ai.canevacol.workers.dev";
const TOKEN_KEY = "caneva_admin_token_v1"; // shared with admin.html on the same origin
const UNDO_KEY = "caneva_admin_movil_undo_v1";
const NEW_CAT = "__new__";

let products = [];
let activeCat = "Todos";
let editing = null;      // { index, original } ; index = -1 for a new product
let pendingPhoto = null; // compressed File waiting to be uploaded

const $ = id => document.getElementById(id);

// ---------- Storage helpers (wrapped: storage may be unavailable) ----------
function getLS(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function setLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function delLS(k){ try{ localStorage.removeItem(k); }catch(e){} }
function token(){ return getLS(TOKEN_KEY); }

// ---------- Formatting helpers (same rules as admin.html) ----------
function norm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function cleanMoney(v){
  let s=String(v||"").trim();
  if(!s) return "";
  const digits=s.replace(/[^\d]/g,"");
  if(!digits) return s;
  return "$"+Number(digits).toLocaleString("es-CO");
}
function shape(p){
  // Keep exactly the fields admin.html publishes
  return {
    categoria:String(p.categoria||"").trim(),
    nombre:String(p.nombre||"").trim(),
    precio:String(p.precio||"").trim(),
    descripcion:String(p.descripcion||"").trim(),
    tallas:String(p.tallas||p.variantes||"").trim(),
    stock:String(p.stock||"").trim(),
    imagen:String(p.imagen||p.imagenPrincipal||"").trim(),
    imagenesExtra:String(p.imagenesExtra||"").trim(),
    url:String(p.url||p.urlProducto||"").trim()
  };
}
// Products can share name+category (e.g. several "Vestido"), so identity = all fields + original position.
const FIELDS=["categoria","nombre","precio","descripcion","tallas","stock","imagen","imagenesExtra","url"];
function sameProduct(a,b){ return a && b && FIELDS.every(k=>a[k]===b[k]); }
function findOriginal(list, original, hintIndex){
  if(hintIndex>=0 && sameProduct(list[hintIndex], original)) return hintIndex;
  return list.findIndex(p=>sameProduct(p, original));
}
function isUrl(v){ return /^https?:\/\//i.test(String(v||"")); }
function isOutOfStock(p){ const s=String(p.stock).trim(); return s!=="" && /^\d+$/.test(s) && Number(s)<=0; }

// ---------- UI helpers ----------
let toastTimer=null;
function toast(msg, opts={}){
  const t=$("toast");
  t.className="toast"+(opts.err?" err":"");
  t.innerHTML=esc(msg)+(opts.action?` <button id="toastAct">${esc(opts.action)}</button>`:"");
  if(opts.action) $("toastAct").onclick=()=>{ t.classList.add("hidden"); opts.onAction(); };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add("hidden"), opts.ms||5000);
}
function busy(on,msg){ $("busy").classList.toggle("hidden",!on); if(msg) $("busyMsg").textContent=msg; }

// ---------- Catalog I/O ----------
// Safari says "Load failed", Chrome "Failed to fetch": the request never reached the Worker (usually CORS).
async function api(url, opts){
  try{ return await fetch(url, opts); }
  catch(e){
    throw new Error(navigator.onLine===false
      ? "Sin internet. Revisa tu conexión."
      : "Cloudflare bloqueó la conexión desde "+location.hostname+" (CORS). Hay que permitir este dominio en el Worker caneva-ai.");
  }
}
async function fetchCatalog(){
  const res=await api(API_BASE+"/catalog?ts="+Date.now(),{cache:"no-store"});
  const data=await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error||"No se pudo leer el catálogo");
  return (Array.isArray(data.products)?data.products:[]).map(shape);
}
async function publish(list, imageFile){
  const fd=new FormData();
  fd.append("products", JSON.stringify(list));
  fd.append("options", JSON.stringify({ replaceUrlWithLocal:false }));
  if(imageFile) fd.append("images", imageFile, imageFile.name);
  const res=await api(API_BASE+"/admin/catalog",{method:"POST",headers:{"x-admin-token":token()},body:fd});
  let data={}; try{ data=await res.json(); }catch(e){}
  if(res.status===401 || res.status===403) throw new Error("Token inválido. Toca Salir y vuelve a entrar.");
  if(!res.ok || !data.ok) throw new Error(data.error||("Error "+res.status));
  return data;
}

// ---------- Image compression (also converts HEIC→JPEG where the browser can decode it) ----------
async function compressImage(file, baseName){
  const MAX=1600, Q=0.85;
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url;});
    const scale=Math.min(1, MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",Q));
    if(!blob) throw new Error("toBlob failed");
    return new File([blob], baseName+".jpg", {type:"image/jpeg"});
  }catch(e){
    // Fallback: upload the original file with a clean name
    const ext=(file.name.match(/\.[a-z0-9]+$/i)||[".jpg"])[0].toLowerCase();
    return new File([file], baseName+ext, {type:file.type||"image/jpeg"});
  }
}
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

// ---------- Rendering ----------
function categories(){
  const counts={}; products.forEach(p=>{ if(p.categoria) counts[p.categoria]=(counts[p.categoria]||0)+1; });
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b)).map(c=>({c,n:counts[c]}));
}
function renderChips(){
  const cats=categories();
  $("chips").innerHTML=[{c:"Todos",n:products.length},...cats].map(x=>
    `<button class="chip ${x.c===activeCat?"on":""}" data-c="${esc(x.c)}">${esc(x.c)} (${x.n})</button>`).join("");
}
function renderGrid(){
  const q=norm($("search").value);
  const rows=products.map((p,i)=>({p,i})).filter(({p})=>
    (activeCat==="Todos"||p.categoria===activeCat) && (!q || norm(p.nombre+" "+p.categoria).includes(q)));
  $("countLine").textContent=`${rows.length} de ${products.length} productos`;
  $("grid").innerHTML=rows.map(({p,i})=>`
    <button class="card" data-i="${i}">
      <div class="ph">${isUrl(p.imagen)?`<img loading="lazy" src="${esc(p.imagen)}" alt="">`:"Sin foto"}</div>
      <div class="meta"><div class="n">${esc(p.nombre)}</div>
      <div class="p">${esc(p.precio)||"Sin precio"}${isOutOfStock(p)?'<span class="badge">AGOTADO</span>':""}</div></div>
    </button>`).join("") || `<p class="muted">No hay productos con ese filtro.</p>`;
}
function renderAll(){
  if(activeCat!=="Todos" && !products.some(p=>p.categoria===activeCat)) activeCat="Todos";
  renderChips(); renderGrid();
  $("renameCatBtn").classList.toggle("hidden", activeCat==="Todos");
}

// ---------- Editor ----------
function setPhotoPreview(src, isNew){
  $("photoBox").innerHTML = src ? `<img src="${esc(src)}" alt="">${isNew?'<span class="newtag">FOTO NUEVA</span>':""}` : `<span class="muted">Sin foto</span>`;
}
function fillCategorySelect(selected){
  const cats=categories().map(x=>x.c);
  if(selected && !cats.includes(selected)) cats.unshift(selected);
  $("fCategoria").innerHTML=cats.map(c=>`<option ${c===selected?"selected":""}>${esc(c)}</option>`).join("")+`<option value="${NEW_CAT}">+ Nueva categoría…</option>`;
  $("newCatField").classList.add("hidden"); $("fNewCat").value="";
}
function openEditor(index){
  const isNew=index<0;
  const p=isNew?shape({categoria:activeCat!=="Todos"?activeCat:(categories()[0]||{}).c}):products[index];
  editing={index, original:isNew?null:{...p}};
  pendingPhoto=null;
  $("fNombre").value=p.nombre; $("fPrecio").value=p.precio; $("fStock").value=p.stock;
  $("fTallas").value=p.tallas; $("fDesc").value=p.descripcion;
  fillCategorySelect(p.categoria);
  setPhotoPreview(isUrl(p.imagen)?p.imagen:"");
  $("deleteBtn").classList.toggle("hidden",isNew);
  $("saveBtn").textContent=isNew?"Crear y publicar":"Guardar y publicar";
  $("sheetBg").classList.remove("hidden"); $("sheet").classList.remove("hidden");
  $("sheet").scrollTop=0; document.body.style.overflow="hidden";
}
function closeEditor(){
  $("sheetBg").classList.add("hidden"); $("sheet").classList.add("hidden");
  document.body.style.overflow=""; editing=null; pendingPhoto=null;
  $("camInput").value=""; $("galInput").value="";
}
async function onPhotoPicked(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  busy(true,"Preparando foto…");
  const name=norm($("fNombre").value)||"producto";
  pendingPhoto=await compressImage(f, `${name}-${stamp()}`);
  busy(false);
  setPhotoPreview(URL.createObjectURL(pendingPhoto), true);
}
function readForm(base){
  let cat=$("fCategoria").value;
  if(cat===NEW_CAT) cat=$("fNewCat").value.trim();
  return {...base,
    nombre:$("fNombre").value.trim(),
    precio:cleanMoney($("fPrecio").value),
    stock:$("fStock").value.trim(),
    tallas:$("fTallas").value.trim(),
    categoria:cat,
    descripcion:$("fDesc").value.trim()
  };
}

// Applies a change on top of the freshest catalog to avoid overwriting edits made elsewhere.
async function applyAndPublish(mutate, imageFile, okMsg){
  busy(true,"Publicando…");
  try{
    const fresh=await fetchCatalog();
    const before=JSON.stringify(fresh);
    const next=mutate(fresh);
    await publish(next, imageFile);
    setLS(UNDO_KEY, before);
    products=await fetchCatalog();
    renderAll(); closeEditor(); busy(false);
    toast(okMsg,{action:"Deshacer",onAction:undoLast,ms:8000});
    return true;
  }catch(e){
    busy(false); toast("Error: "+e.message,{err:true,ms:8000}); return false;
  }
}
async function save(){
  if(!editing) return;
  const isNew=editing.index<0;
  const updated=readForm(isNew?shape({}):editing.original);
  if(!updated.nombre){ toast("Falta el nombre.",{err:true}); return; }
  if(!updated.categoria){ toast("Falta la categoría.",{err:true}); return; }
  if(pendingPhoto) updated.imagen=pendingPhoto.name; // Worker matches this name with the uploaded file
  const original=editing.original;
  await applyAndPublish(list=>{
    if(isNew){
      return [updated,...list];
    }
    const i=findOriginal(list, original, editing.index);
    if(i<0) throw new Error("Este producto cambió en otro lado. Toca Recargar e intenta de nuevo.");
    list[i]=updated; return list;
  }, pendingPhoto, isNew?"Producto creado ✓":"Cambios publicados ✓");
}
async function removeProduct(){
  if(!editing||editing.index<0) return;
  const original=editing.original;
  if(!confirm(`¿Eliminar "${original.nombre}" del catálogo?`)) return;
  await applyAndPublish(list=>{
    const i=findOriginal(list, original, editing.index);
    if(i<0) throw new Error("No se encontró el producto. Toca Recargar.");
    list.splice(i,1); return list;
  }, null, "Producto eliminado");
}
// Renames a whole category (or merges it into an existing one) in a single publish.
const HIDDEN_CAT_WORDS=/domicilio|domicl|mayorista|others/i; // same filter the store and the AI use
async function renameCategory(){
  const oldName=activeCat; if(oldName==="Todos") return;
  const count=products.filter(p=>p.categoria===oldName).length;
  const input=prompt(`Nuevo nombre para "${oldName}" (${count} productos):`, oldName);
  if(input===null) return;
  const newName=input.trim().replace(/\s+/g," ");
  if(!newName || newName===oldName) return;
  const existing=categories().map(x=>x.c).find(c=>c.toLowerCase()===newName.toLowerCase() && c!==oldName);
  if(existing && !confirm(`"${existing}" ya existe. ¿Unir los ${count} productos de "${oldName}" dentro de "${existing}"?`)) return;
  if(HIDDEN_CAT_WORDS.test(newName) && !confirm(`Ojo: las categorías con "Domicilio", "Mayorista" u "Others" no se muestran en la tienda. ¿Continuar?`)) return;
  const target=existing||newName;
  const ok=await applyAndPublish(list=>{
    let n=0;
    const next=list.map(p=>p.categoria===oldName?(n++,{...p,categoria:target}):p);
    if(!n) throw new Error("La categoría ya no existe. Toca Recargar.");
    return next;
  }, null, `Categoría renombrada a "${target}" ✓`);
  if(ok){ activeCat=target; renderAll(); }
}

async function undoLast(){
  const raw=getLS(UNDO_KEY); if(!raw){ toast("No hay nada para deshacer."); return; }
  busy(true,"Deshaciendo…");
  try{
    await publish(JSON.parse(raw), null);
    delLS(UNDO_KEY);
    products=await fetchCatalog(); renderAll(); busy(false); toast("Cambio deshecho ✓");
  }catch(e){ busy(false); toast("Error: "+e.message,{err:true}); }
}

// ---------- Boot ----------
async function loadList(){
  busy(true,"Cargando catálogo…");
  try{ products=await fetchCatalog(); renderAll(); }
  catch(e){ toast("Error: "+e.message,{err:true}); }
  busy(false);
}
function showLogin(){ $("loginView").classList.remove("hidden"); $("listView").classList.add("hidden"); }
function showList(){ $("loginView").classList.add("hidden"); $("listView").classList.remove("hidden"); loadList(); }

$("loginBtn").onclick=()=>{ const t=$("tokenInput").value.trim(); if(!t){ toast("Pega el token.",{err:true}); return; } setLS(TOKEN_KEY,t); showList(); };
$("logoutBtn").onclick=()=>{ if(confirm("¿Cerrar sesión y borrar el token de este celular?")){ delLS(TOKEN_KEY); showLogin(); } };
$("reloadBtn").onclick=loadList;
$("renameCatBtn").onclick=renameCategory;
$("search").oninput=renderGrid;
$("chips").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; activeCat=b.dataset.c; renderAll(); };
$("grid").onclick=e=>{ const c=e.target.closest(".card"); if(c) openEditor(Number(c.dataset.i)); };
$("newBtn").onclick=()=>openEditor(-1);
$("sheetBg").onclick=closeEditor; $("cancelBtn").onclick=closeEditor;
$("saveBtn").onclick=save; $("deleteBtn").onclick=removeProduct;
$("camInput").onchange=onPhotoPicked; $("galInput").onchange=onPhotoPicked;
$("fCategoria").onchange=()=>$("newCatField").classList.toggle("hidden",$("fCategoria").value!==NEW_CAT);

token()?showList():showLogin();
</script>
</body>
</html>
